<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9e9ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
<title>Wichtel</title>
<meta name="description" content="A small Secret Santa draw. One link per person, no accounts, no server.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app" class="screen"></main>

<template id="tpl-setup">
  <header class="top">
    <p class="eyebrow mono">Wichteln</p>
    <h1 class="title" id="group"></h1>
  </header>
  <section class="tile">
    <div class="row-between"><span class="label">Participants</span><span class="muted mono" id="count">0</span></div>
    <ul class="people" id="people"></ul>
    <form class="add" id="add-form" autocomplete="off">
      <input id="add-name" placeholder="Add a name" aria-label="Name">
      <button class="round" type="submit" aria-label="Add person">
        <svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg>
      </button>
    </form>
  </section>
  <p class="error" id="error" role="alert" hidden></p>
  <button class="primary" id="draw">Draw names</button>
</template>

<template id="tpl-links">
  <header class="top">
    <p class="eyebrow mono" id="draw-id"></p>
    <h1 class="title" id="group"></h1>
  </header>
  <section class="tile">
    <div class="row-between"><span class="label">Send each person their link</span><span class="muted mono" id="sent"></span></div>
    <ul class="links" id="links"></ul>
  </section>
  <p class="foot muted tiny">Send each link as a private message. A link only shows that one person's name to draw.</p>
  <div class="actions">
    <button class="secondary" id="reroll">Reroll</button>
    <button class="ghost" id="back">Edit people</button>
  </div>
</template>

<template id="tpl-reveal">
  <header class="top">
    <p class="eyebrow mono" id="draw-id"></p>
    <h1 class="title" id="group"></h1>
  </header>
  <button class="tile reveal" id="reveal" aria-live="polite">
    <span class="label" id="hi"></span>
    <span class="reveal-name" id="match">Tap to see who you draw</span>
    <span class="muted tiny" id="reveal-hint">Make sure nobody is looking at your screen.</span>
  </button>
</template>

<script src="draw.js"></script>
<script src="app.js"></script>
</body>
</html>
